apiVersion: v1
kind: Namespace
metadata:
  name: cilium-policy-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-policy-observer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-namespace-server
  namespace: cilium-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cross-namespace-server
  template:
    metadata:
      labels:
        app: cross-namespace-server
        scenario: cross-namespace
    spec:
      containers:
        - name: server
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cross-namespace-server
  namespace: cilium-policy-demo
spec:
  selector:
    app: cross-namespace-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-namespace-local-client
  namespace: cilium-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cross-namespace-client
      location: local
  template:
    metadata:
      labels:
        app: cross-namespace-client
        location: local
        scenario: cross-namespace
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
